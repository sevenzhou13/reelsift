<div class="rounded-[28px] bg-[#0E0E10] px-5 py-10 sm:px-8">
  <div class="mb-10 flex items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <div class="h-5 w-5 rounded-md bg-lime-300"></div>
      <span class="text-sm font-medium tracking-[-0.01em] text-white">REELSIFT</span>
    </div>
    <span class="text-xs text-slate-500">本地上传 · 完成后自动进入素材库</span>
  </div>

  <div class="text-center">
    <p class="text-3xl font-medium leading-tight tracking-[-0.03em] text-white sm:text-4xl">
      把素材拖进来，
      <span class="text-lime-300">逐条看 AI 解析进度</span>
    </p>
    <p class="mx-auto mt-4 max-w-2xl text-sm leading-6 text-slate-400">
      本地上传视频后，Reelsift 会自动抽帧、分析、打标签，并在这一页显示每条视频的处理阶段。
    </p>
  </div>

  <div class="mx-auto mt-8 max-w-3xl rounded-[22px] border border-white/10 bg-[#17171A] px-6 py-6">
    <div class="grid gap-4 md:grid-cols-[220px_minmax(0,1fr)]">
      <label class="block">
        <span class="mb-2 block text-[10px] uppercase tracking-[0.18em] text-slate-500">上传到素材库</span>
        <select
          id="library-select"
          class="w-full rounded-2xl border border-white/10 bg-[#0E0E10] px-4 py-3 text-sm text-white outline-none focus:border-lime-300"
        >
          {% for library in libraries %}
          <option value="{{ library.id }}" {% if selected_library_id == library.id %}selected{% endif %}>{{ library.name }}（{{ library.clip_count }}）</option>
          {% endfor %}
        </select>
      </label>

      <label class="block">
        <span class="mb-2 block text-[10px] uppercase tracking-[0.18em] text-slate-500">或新建素材库</span>
        <input
          id="new-library-name"
          type="text"
          value="{{ pending_library_name }}"
          placeholder="输入新素材库名称，例如：成都旅行 / 4月校园拍摄"
          class="w-full rounded-2xl border border-white/10 bg-[#0E0E10] px-4 py-3 text-sm text-white outline-none placeholder:text-slate-600 focus:border-lime-300"
        >
      </label>
    </div>
    <p class="mt-3 text-xs text-slate-500">如果填写了“新建素材库”，本次上传会优先创建并写入新素材库。</p>
  </div>

  <div class="mx-auto mt-8 max-w-3xl rounded-[22px] border border-dashed border-white/15 bg-lime-300/[0.03] px-6 py-10 text-center">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-lime-300/10 text-lime-300">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 4V16M12 16L7.5 11.5M12 16L16.5 11.5M5 18V19A2 2 0 0 0 7 21H17A2 2 0 0 0 19 19V18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="mt-5 text-xl font-medium text-white">拖入本地视频，或浏览电脑选择</p>
    <p class="mt-2 text-sm text-slate-400">
      支持 MP4 / MOV / MKV / WEBM，单次最多 50 条视频。
    </p>
    <button
      id="upload-trigger"
      type="button"
      class="mt-6 rounded-2xl border border-lime-300/40 bg-lime-300/90 px-5 py-3 text-sm font-medium text-slate-950 transition hover:bg-lime-200"
    >
      选择本地视频
    </button>
  </div>

  {% if upload_error %}
  <div class="mx-auto mt-5 max-w-3xl rounded-2xl border border-rose-400/20 bg-rose-400/10 px-4 py-4 text-sm text-rose-100">
    {{ upload_error }}
  </div>
  {% endif %}

  <div class="mx-auto mt-5 flex max-w-3xl flex-wrap items-center justify-center gap-4 text-xs text-slate-500">
    <span>本地运行，不走云存储</span>
    <span class="text-slate-700">·</span>
    <span>支持多素材库分类整理</span>
    <span class="text-slate-700">·</span>
    <span>上传页只负责进度</span>
    <span class="text-slate-700">·</span>
    <span>全部完成后自动跳转</span>
  </div>
</div>
