<div class="mb-8 grid grid-cols-3 gap-3 sm:max-w-md sm:gap-4">
  <div class="rounded-[18px] border border-[#2A2A30] bg-[#17171A] px-4 py-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-[#8A8A92]">结果数</p>
    <p class="mt-2 text-2xl font-medium tracking-tight text-white">{{ stats.total }}</p>
  </div>
  <div class="rounded-[18px] border border-[#2A2A30] bg-[#17171A] px-4 py-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-[#8A8A92]">成功</p>
    <p class="mt-2 text-2xl font-medium tracking-tight text-white">{{ stats.done }}</p>
  </div>
  <div class="rounded-[18px] border border-[#2A2A30] bg-[#17171A] px-4 py-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-[#8A8A92]">失败</p>
    <p class="mt-2 text-2xl font-medium tracking-tight text-white">{{ stats.failed }}</p>
  </div>
</div>

{% if clips %}
<div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
  {% for clip in clips %}
  <article
    data-clip-card
    class="relative overflow-hidden rounded-[20px] border border-[#2A2A30] bg-[#17171A] transition duration-200"
  >
    <input
      id="clip-{{ clip.id }}"
      type="checkbox"
      name="selected_ids"
      value="{{ clip.id }}"
      class="sr-only"
    >
    <label
      for="clip-{{ clip.id }}"
      data-selection-control
      class="absolute right-3 top-3 z-20 inline-flex cursor-pointer items-center gap-2 rounded-full border border-[#3A3A42] bg-black/60 px-3 py-1 text-[11px] text-white backdrop-blur"
    >
      <span class="selection-dot inline-flex h-4 w-4 items-center justify-center rounded-full border border-[#3A3A42] bg-transparent text-[10px] leading-none text-transparent transition">✓</span>
      选择
    </label>

    <a href="/clips/{{ clip.id }}?library_id={{ current_library_id }}" class="block">
      <div class="relative aspect-[16/10] overflow-hidden bg-[#222228]">
        {% if clip.cover_url %}
        <img src="{{ clip.cover_url }}" alt="{{ clip.filename }}" class="h-full w-full object-cover">
        {% else %}
        <div class="flex h-full items-center justify-center text-sm text-[#8A8A92]">暂无封面</div>
        {% endif %}
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/55 to-transparent px-4 pb-4 pt-10">
          <div class="flex items-center justify-between gap-3">
            <span class="text-[11px] uppercase tracking-[0.12em] text-[#8A8A92]">{{ clip.scene }}</span>
            <span class="rounded-full border border-white/10 px-2 py-0.5 text-[10px] text-white/80">{{ clip.status }}</span>
          </div>
        </div>
      </div>

      <div class="p-4">
        <p class="line-clamp-2 text-[17px] font-medium leading-6 tracking-[-0.01em] text-white">{{ clip.summary }}</p>
      </div>
    </a>
  </article>
  {% endfor %}
</div>
{% else %}
<div class="rounded-[20px] border border-dashed border-[#2A2A30] bg-[#17171A] px-6 py-16 text-center">
  <p class="text-lg font-medium text-white">没有匹配到素材</p>
  <p class="mt-3 text-sm text-[#8A8A92]">你可以换个关键词，或者清空标签筛选后再试。</p>
</div>
{% endif %}
