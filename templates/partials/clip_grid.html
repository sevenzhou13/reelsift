{% if clips %}
<div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
  {% for clip in clips %}
  {% include "partials/clip_card.html" %}
  {% endfor %}
</div>
{% else %}
<div class="rounded-[20px] border border-dashed border-[#2A2A30] bg-[#17171A] px-6 py-16 text-center">
  <p class="text-lg font-medium text-white">没有匹配到素材</p>
  <p class="mt-3 text-sm text-[#8A8A92]">你可以换个关键词，或者清空标签筛选后再试。</p>
</div>
{% endif %}
