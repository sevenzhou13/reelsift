{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
  <section class="mb-6 flex items-center justify-between gap-4">
    <div>
      <p class="text-[11px] uppercase tracking-[0.22em] text-[#8A8A92]">Recycle Bin</p>
      <h1 class="mt-2 text-3xl font-medium tracking-[-0.02em] text-white sm:text-4xl">{{ current_library.name if current_library else "当前项目" }} 回收站</h1>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-[#8A8A92]">这里会保留近 7 天内移出的素材，到期自动清理。</p>
    </div>
    <a href="{{ return_url }}" class="rounded-xl border border-[#3A3A42] px-4 py-2.5 text-sm text-white transition hover:border-white/20">&larr; 返回素材库</a>
  </section>

  <section class="rounded-[24px] border border-[#2A2A30] bg-[#17171A] p-5">
    {% if recycle_items %}
    <form action="/recycle/restore" method="post" class="space-y-4">
      <input type="hidden" name="library_id" value="{{ current_library_id }}">
      <div class="grid gap-3">
        {% for item in recycle_items %}
        <label class="flex items-start gap-3 rounded-[16px] border border-white/5 bg-[#101013] px-4 py-4">
          <input type="checkbox" name="selected_ids" value="{{ item.clip_id }}" class="mt-1 h-4 w-4 rounded border-[#3A3A42] bg-[#0E0E10] text-[#D7FF3E]">
          <div class="min-w-0">
            <p class="text-base text-white">{{ item.summary }}</p>
            <p class="mt-1 text-sm text-[#8A8A92]">{{ item.filename }}</p>
            <p class="mt-2 text-[11px] uppercase tracking-[0.08em] text-[#8A8A92]">保留至 {{ item.expires_at }}</p>
          </div>
        </label>
        {% endfor %}
      </div>
      <button
        type="submit"
        class="rounded-xl border border-[#3A3A42] px-4 py-2.5 text-sm text-white transition hover:border-white/20"
      >
        恢复选中素材
      </button>
    </form>
    {% else %}
    <div class="rounded-[16px] border border-dashed border-[#2A2A30] px-6 py-16 text-center">
      <p class="text-lg font-medium text-white">回收站是空的</p>
      <p class="mt-3 text-sm text-[#8A8A92]">当前项目最近 7 天内没有被移除的素材。</p>
    </div>
    {% endif %}
  </section>
</main>
{% endblock %}
