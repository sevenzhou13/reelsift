{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <section class="mb-8 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.24em] text-cyan-300/80">Reelsift</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight text-white sm:text-4xl">素材结果总览</h1>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-300">
        这里展示已经写入 SQLite 的视频分析结果，包括封面、摘要、场景、标签和清晰度评分。
      </p>
    </div>
  </section>

  <section class="mb-8 rounded-3xl border border-white/10 bg-white/5 p-4 shadow-[0_20px_60px_rgba(0,0,0,0.22)] sm:p-5">
    <form
      hx-get="/clips"
      hx-target="#clip-grid"
      hx-trigger="submit, keyup changed delay:300ms from:#search-input, change from:#tag-select"
      class="flex flex-col gap-4"
    >
      <div class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_220px_120px]">
        <label class="block">
          <span class="mb-2 block text-xs uppercase tracking-[0.18em] text-slate-400">关键词搜索</span>
          <input
            id="search-input"
            type="text"
            name="q"
            value="{{ current_query }}"
            placeholder="搜索文件名、摘要、场景、标签"
            class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none ring-0 placeholder:text-slate-500 focus:border-cyan-400/40"
          >
        </label>
        <label class="block">
          <span class="mb-2 block text-xs uppercase tracking-[0.18em] text-slate-400">标签筛选</span>
          <select
            id="tag-select"
            name="tag"
            class="w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none focus:border-cyan-400/40"
          >
            <option value="">全部标签</option>
            {% for tag_name, tag_count in all_tags %}
            <option value="{{ tag_name }}" {% if current_tag == tag_name %}selected{% endif %}>{{ tag_name }}（{{ tag_count }}）</option>
            {% endfor %}
          </select>
        </label>
        <div class="flex items-end gap-3">
          <button
            type="submit"
            class="w-full rounded-2xl border border-cyan-400/30 bg-cyan-400/15 px-4 py-3 text-sm font-medium text-cyan-100 transition hover:bg-cyan-400/20"
          >
            应用筛选
          </button>
        </div>
      </div>

      <div class="flex flex-wrap gap-2">
        {% for tag_name, tag_count in all_tags %}
        <button
          type="button"
          hx-get="/clips?q={{ current_query|urlencode }}&tag={{ tag_name|urlencode }}"
          hx-target="#clip-grid"
          class="rounded-full border px-3 py-1 text-xs font-medium transition {% if current_tag == tag_name %}border-cyan-300/50 bg-cyan-300/15 text-cyan-100{% else %}border-white/10 bg-white/5 text-slate-300 hover:border-cyan-400/30 hover:text-white{% endif %}"
        >
          {{ tag_name }} · {{ tag_count }}
        </button>
        {% endfor %}
      </div>
    </form>
  </section>

  <section id="clip-grid">
    {% include "partials/clip_grid.html" %}
  </section>
</main>
{% endblock %}
