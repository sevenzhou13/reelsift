{% extends "base.html" %}
{% block content %}
<main class="mx-auto flex min-h-screen max-w-4xl items-center px-4 py-10 sm:px-6 lg:px-8">
  <section class="w-full rounded-[28px] border border-white/10 bg-[#111214] p-8 shadow-2xl shadow-black/30 sm:p-10">
    <p class="text-xs uppercase tracking-[0.28em] text-cyan-300">Reelsift Register</p>
    <h1 class="mt-4 text-3xl font-semibold tracking-tight text-white">创建新用户</h1>
    <p class="mt-3 max-w-2xl text-sm leading-7 text-gray-300">
      注册后会自动拥有自己的素材库视图。当前注册入口默认创建普通用户账号，管理员账号请在后台创建。
    </p>

    <form action="/register" method="post" class="mt-8 grid gap-5 sm:grid-cols-2">
      <div class="sm:col-span-1">
        <label for="display_name" class="mb-2 block text-sm text-gray-300">显示名</label>
        <input id="display_name" name="display_name" type="text" class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 text-white outline-none transition focus:border-cyan-300">
      </div>
      <div class="sm:col-span-1">
        <label for="username" class="mb-2 block text-sm text-gray-300">用户名</label>
        <input id="username" name="username" type="text" required class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 text-white outline-none transition focus:border-cyan-300">
      </div>
      <div class="sm:col-span-1">
        <label for="password" class="mb-2 block text-sm text-gray-300">密码</label>
        <input id="password" name="password" type="password" required class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 text-white outline-none transition focus:border-cyan-300">
      </div>
      <div class="sm:col-span-1">
        <label for="confirm_password" class="mb-2 block text-sm text-gray-300">确认密码</label>
        <input id="confirm_password" name="confirm_password" type="password" required class="w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 text-white outline-none transition focus:border-cyan-300">
      </div>

      {% if error_message %}
      <div class="sm:col-span-2 rounded-2xl border border-red-400/30 bg-red-400/10 px-4 py-3 text-sm text-red-200">
        {{ error_message }}
      </div>
      {% endif %}

      {% if success_message %}
      <div class="sm:col-span-2 rounded-2xl border border-emerald-400/30 bg-emerald-400/10 px-4 py-3 text-sm text-emerald-200">
        {{ success_message }}
      </div>
      {% endif %}

      <div class="sm:col-span-2 flex flex-wrap items-center gap-3">
        <button type="submit" class="rounded-2xl bg-cyan-300 px-5 py-3 text-sm font-semibold text-black transition hover:bg-cyan-200">
          创建用户
        </button>
        <a href="/login" class="text-sm text-gray-400 transition hover:text-white">返回登录</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
