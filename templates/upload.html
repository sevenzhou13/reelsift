{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
  <section class="mb-8 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.24em] text-cyan-300/80">Reelsift</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight text-white sm:text-4xl">上传素材并等待 AI 解析完成</h1>
      <p class="mt-3 max-w-3xl text-sm leading-6 text-slate-300">
        这一页负责选择素材库、上传视频和查看处理进度。每条视频都会显示独立的解析阶段，全部完成后会自动进入对应素材库。
      </p>
    </div>

    <a
      href="/"
      class="inline-flex items-center justify-center rounded-2xl border border-white/10 bg-white/5 px-5 py-3 text-sm font-medium text-white transition hover:border-white/20 hover:bg-white/10"
    >
      返回素材库
    </a>
  </section>

  <form
    id="upload-form"
    hx-post="/upload/jobs"
    hx-target="#upload-flow"
    hx-swap="innerHTML"
    hx-encoding="multipart/form-data"
    class="hidden"
  >
    <input
      id="upload-input"
      type="file"
      name="files"
      multiple
      accept=".mp4,.mov,.mkv,.webm,video/mp4,video/quicktime,video/x-matroska,video/webm"
      class="hidden"
    >
    <input
      id="upload-folder-input"
      type="file"
      name="files"
      multiple
      webkitdirectory
      directory
      accept=".mp4,.mov,.mkv,.webm,video/mp4,video/quicktime,video/x-matroska,video/webm"
      class="hidden"
    >
    <input id="upload-library-id" type="hidden" name="library_id" value="{{ selected_library_id }}">
    <input id="upload-new-library-name" type="hidden" name="new_library_name" value="{{ pending_library_name }}">
    <input id="upload-file-metadata" type="hidden" name="file_metadata_json" value="[]">
  </form>
  <form
    id="folder-scan-form"
    hx-post="/sources/folders"
    hx-target="#upload-flow"
    hx-swap="innerHTML"
    class="hidden"
  >
    <input id="folder-scan-path" type="hidden" name="folder_path">
    <input id="folder-scan-library-id" type="hidden" name="library_id" value="{{ selected_library_id }}">
    <input id="folder-scan-library-name" type="hidden" name="new_library_name" value="{{ pending_library_name }}">
  </form>

  <section id="upload-flow">
    {% include "partials/upload_panel.html" %}
  </section>
</main>

<script>
  (() => {
    const autoScanFolder = {{ auto_scan_folder|tojson }};
    const uploadInput = document.getElementById("upload-input");
    const uploadFolderInput = document.getElementById("upload-folder-input");
    const uploadForm = document.getElementById("upload-form");
    const hiddenLibraryId = document.getElementById("upload-library-id");
    const hiddenNewLibraryName = document.getElementById("upload-new-library-name");
    const hiddenFileMetadata = document.getElementById("upload-file-metadata");
    const folderScanForm = document.getElementById("folder-scan-form");
    const folderScanPath = document.getElementById("folder-scan-path");
    const folderScanLibraryId = document.getElementById("folder-scan-library-id");
    const folderScanLibraryName = document.getElementById("folder-scan-library-name");
    const videoExtensions = new Set([".mp4", ".mov", ".mkv", ".webm"]);

    function syncLibraryInputs() {
      const librarySelect = document.getElementById("library-select");
      const newLibraryName = document.getElementById("new-library-name");
      if (librarySelect && hiddenLibraryId) {
        hiddenLibraryId.value = librarySelect.value;
      }
      if (newLibraryName && hiddenNewLibraryName) {
        hiddenNewLibraryName.value = newLibraryName.value;
      }
      if (librarySelect && folderScanLibraryId) folderScanLibraryId.value = librarySelect.value;
      if (newLibraryName && folderScanLibraryName) folderScanLibraryName.value = newLibraryName.value;
    }

    function getFilePathParts(file) {
      const rawPath = file.webkitRelativePath || file.name || "";
      return rawPath.split("/").filter(Boolean);
    }

    function isHiddenFolderUploadFile(file) {
      return getFilePathParts(file).some((part) => part.startsWith(".") || part === "__MACOSX");
    }

    function isSupportedVideoFile(file) {
      const name = (file.name || "").toLowerCase();
      return Array.from(videoExtensions).some((extension) => name.endsWith(extension));
    }

    function filterUploadInput(input) {
      if (!input || !input.files || input.files.length === 0 || typeof DataTransfer === "undefined") {
        return input && input.files ? input.files.length : 0;
      }
      const dataTransfer = new DataTransfer();
      Array.from(input.files)
        .filter((file) => !isHiddenFolderUploadFile(file) && isSupportedVideoFile(file))
        .forEach((file) => dataTransfer.items.add(file));
      input.files = dataTransfer.files;
      return input.files.length;
    }

    function syncFileMetadata(input) {
      if (!hiddenFileMetadata) return;
      const metadata = Array.from(input && input.files ? input.files : []).map((file) => ({
        name: file.name || "",
        relative_path: file.webkitRelativePath || file.name || "",
        last_modified: file.lastModified || null,
      }));
      hiddenFileMetadata.value = JSON.stringify(metadata);
    }

    function getTopFolderName(files) {
      const firstFile = Array.from(files || []).find((file) => !isHiddenFolderUploadFile(file));
      const relativePath = firstFile && firstFile.webkitRelativePath ? firstFile.webkitRelativePath : "";
      const folderName = relativePath.split("/").filter(Boolean)[0] || "";
      return folderName.trim();
    }

    function syncFolderLibraryName() {
      const newLibraryName = document.getElementById("new-library-name");
      const folderName = getTopFolderName(uploadFolderInput.files);
      if (!folderName || !newLibraryName || !hiddenNewLibraryName) return;
      newLibraryName.value = folderName;
      hiddenNewLibraryName.value = folderName;
    }

    function startFolderScan(folderPath) {
      if (!folderPath || !folderScanPath || !folderScanForm) return;
      folderScanPath.value = folderPath;
      if (folderScanLibraryName && !folderScanLibraryName.value.trim()) {
        folderScanLibraryName.value = folderPath.split("/").filter(Boolean).pop() || "素材库";
      }
      htmx.trigger(folderScanForm, "submit");
    }

    function bindUploadTrigger() {
      const trigger = document.getElementById("upload-trigger");
      const folderTrigger = document.getElementById("upload-folder-trigger");
      const scanFolderTrigger = document.getElementById("scan-folder-trigger");
      const librarySelect = document.getElementById("library-select");
      const newLibraryName = document.getElementById("new-library-name");
      if (!trigger || trigger.dataset.bound === "true") return;

      trigger.dataset.bound = "true";
      trigger.addEventListener("click", () => {
        if (uploadFolderInput) uploadFolderInput.value = "";
        syncLibraryInputs();
        uploadInput.click();
      });
      if (folderTrigger && folderTrigger.dataset.bound !== "true") {
        folderTrigger.dataset.bound = "true";
        folderTrigger.addEventListener("click", () => {
          if (uploadInput) uploadInput.value = "";
          syncLibraryInputs();
          uploadFolderInput.click();
        });
      }
      if (scanFolderTrigger && scanFolderTrigger.dataset.bound !== "true") {
        scanFolderTrigger.dataset.bound = "true";
        scanFolderTrigger.addEventListener("click", async () => {
          syncLibraryInputs();
          scanFolderTrigger.disabled = true;
          scanFolderTrigger.textContent = "正在打开 Finder…";
          try {
            const response = await fetch("/api/pick-folder");
            const result = await response.json();
            if (result.error) throw new Error(result.error);
            startFolderScan(result.path);
          } catch (error) {
            window.alert(error.message || "无法选择本地文件夹。");
          } finally {
            scanFolderTrigger.disabled = false;
            scanFolderTrigger.textContent = "扫描本地素材文件夹";
          }
        });
      }
      if (librarySelect && librarySelect.dataset.bound !== "true") {
        librarySelect.dataset.bound = "true";
        librarySelect.addEventListener("change", syncLibraryInputs);
      }
      if (newLibraryName && newLibraryName.dataset.bound !== "true") {
        newLibraryName.dataset.bound = "true";
        newLibraryName.addEventListener("input", syncLibraryInputs);
      }
    }

    if (uploadInput) {
      uploadInput.addEventListener("change", () => {
        if (filterUploadInput(uploadInput) > 0) {
          syncLibraryInputs();
          syncFileMetadata(uploadInput);
          htmx.trigger(uploadForm, "submit");
        }
      });
    }

    if (uploadFolderInput) {
      uploadFolderInput.addEventListener("change", () => {
        if (filterUploadInput(uploadFolderInput) > 0) {
          syncFolderLibraryName();
          syncLibraryInputs();
          syncFileMetadata(uploadFolderInput);
          htmx.trigger(uploadForm, "submit");
        }
      });
    }

    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (event.target && event.target.id === "upload-flow") {
        bindUploadTrigger();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      bindUploadTrigger();
      if (autoScanFolder) startFolderScan(autoScanFolder);
    });
  })();
</script>
{% endblock %}
