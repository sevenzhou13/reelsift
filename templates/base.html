<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reelsift</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  {% if current_user is defined and current_user %}
  <header class="border-b border-white/10 bg-black/20 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
      <div>
        <a href="/" class="text-sm font-semibold tracking-[0.2em] text-lime-300">REELSIFT</a>
        <p class="mt-1 text-xs text-gray-400">
          {{ current_user.display_name or current_user.username }}
          <span class="mx-1 text-gray-600">/</span>
          {{ "管理员" if is_admin else "用户" }}
        </p>
      </div>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/" class="text-gray-300 transition hover:text-white">素材库</a>
        <a href="/upload" class="text-gray-300 transition hover:text-white">上传</a>
        <a href="/account" class="text-gray-300 transition hover:text-white">账户</a>
        {% if is_admin %}
        <a href="/admin" class="text-gray-300 transition hover:text-white">管理后台</a>
        {% endif %}
        <form action="/logout" method="post">
          <button
            type="submit"
            class="rounded-lg border border-white/10 px-3 py-1.5 text-gray-200 transition hover:border-white/20 hover:text-white"
          >
            退出
          </button>
        </form>
      </nav>
    </div>
  </header>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
